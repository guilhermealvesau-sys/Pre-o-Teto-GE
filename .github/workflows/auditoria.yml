name: Auditoria (referências independentes)

on:
  workflow_dispatch:
    inputs:
      parte:
        description: "referencias, detalhe ou ambas"
        required: true
        default: ambas
        type: choice
        options: [ambas, referencias, detalhe]

permissions:
  contents: write

concurrency:
  group: auditoria
  cancel-in-progress: false

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar referências
        if: inputs.parte != 'detalhe'
        run: python -m ferramentas.auditoria_referencias

      - name: Coletar registros brutos para diagnóstico
        if: inputs.parte != 'referencias'
        run: python -m ferramentas.auditoria_detalhe

      - name: Gravar no repositório
        run: |
          git config user.name "coletor-bot"
          git config user.email "coletor-bot@users.noreply.github.com"
          git add auditoria/
          if ! git diff --cached --quiet; then
            git commit -m "auditoria: referências independentes $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
